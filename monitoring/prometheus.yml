global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: arabic-sentiment-bentoml
    metrics_path: /metrics
    static_configs:
      # BentoML runs on the host (bentoml serve, port 8000); Prometheus runs in
      # Docker, so it reaches the host through host.docker.internal.
      - targets: ["host.docker.internal:8000"]