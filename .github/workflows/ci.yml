name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu    

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,serving]"

      - name: Lint with Ruff
        run: ruff check .
      
      - name: Run Quality Gate Check
        env:
          PYTHONPATH: .
        run: python src/arabic_sentiment/evaluate.py --check-only

      - name: Test with Pytest
        run: pytest tests/ -v

  docker-build-push:
    name: Build & Push Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Determine Docker Tags
        id: meta
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/nlp-service:${{ github.sha }}"
          if [ "${{ github.event_name }}" == "push" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/nlp-service:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nlp-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nlp-service:buildcache,mode=max